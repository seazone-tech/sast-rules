rules:
- id: insecure-hash-algorithm-sha1-hashlib
  pattern: hashlib.sha1(...)
  fix-regex:
    regex: sha1
    replacement: sha256
  message: >-
    Detected SHA1 hash algorithm which is considered insecure. SHA1 is not
    collision resistant and is therefore not suitable as a cryptographic
    signature. Use SHA256 or SHA3 instead.
  metadata:
    source-rule-url: https://github.com/PyCQA/bandit/blob/d5f8fa0d89d7b11442fc6ec80ca42953974354c8/bandit/blacklists/calls.py#L59
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    bandit-code: B303
    asvs:
      section: V6 Stored Cryptography Verification Requirements
      control_id: 6.2.2 Insecure Custom Algorithm
      control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x14-V6-Cryptography.md#v62-algorithms
      version: '4'
    references:
    - https://www.schneier.com/blog/archives/2012/10/when_will_we_se.html
    - https://www.trendmicro.com/vinfo/us/security/news/vulnerabilities-and-exploits/sha-1-collision-signals-the-end-of-the-algorithm-s-viability
    - http://2012.sharcs.org/slides/stevens.pdf
    - https://pycryptodome.readthedocs.io/en/latest/src/hash/sha3_256.html
    category: security
    technology:
    - python
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    seazone-promoted-from: deep-scan/python/lang/security/insecure-hash-algorithms.yaml
    seazone-promotion-rationale: >-
      Vendored upstream confidence is MEDIUM (below this ruleset's normal
      HIGH-confidence bar for pr-blocking/), but hashlib.sha1(...) is a
      direct, unambiguous call-pattern (no usedforsecurity=False escape
      hatch exists upstream for this rule, unlike the sibling md5-hashlib
      promotion) with negligible false-positive risk in practice. Promoted
      as a continuation of the FU-B hashlib.md5 exception (see
      insecure-hash-algorithms-md5.yaml and README.md "Promoted exception"),
      because hashlib.sha1 is the second most common Python weak-hash
      pattern in Seazone code and pr-blocking/ previously had zero SHA1
      coverage. Rule id suffixed -hashlib because the bare id
      insecure-hash-algorithm-sha1 is reused by THREE separate deep-scan
      rules for three distinct call patterns:
      deep-scan/python/lang/security/insecure-hash-algorithms.yaml
      (hashlib.sha1(...), promoted here),
      deep-scan/python/cryptography/security/insecure-hash-algorithms.yaml
      (cryptography.hazmat.primitives.hashes.SHA1(...), NOT promoted), and
      deep-scan/python/pycryptodome/security/insecure-hash-algorithm.yaml
      (Crypto.Hash.SHA.new(...)/Cryptodome.Hash.SHA.new(...), NOT promoted).
      Only the hashlib variant is promoted in this change; the suffix
      pre-empts a future id collision if either of the other two is ever
      promoted, mirroring the -hashlib precedent set for MD5.
  severity: WARNING
  languages:
  - python
