rules:
- id: md5-used-as-password
  severity: WARNING
  message: >-
    It looks like MD5 is used as a password hash. MD5 is not considered a
    secure password hash because it can be cracked by an attacker in a short
    amount of time. Use a suitable password hashing function such as scrypt.
    You can use `hashlib.scrypt`.
  languages: [python]
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    references:
    - https://tools.ietf.org/html/rfc6151
    - https://crypto.stackexchange.com/questions/44151/how-does-the-flame-malware-take-advantage-of-md5-collision
    - https://pycryptodome.readthedocs.io/en/latest/src/hash/sha3_256.html
    - https://security.stackexchange.com/questions/211/how-to-securely-hash-passwords
    - https://github.com/returntocorp/semgrep-rules/issues/1609
    - https://docs.python.org/3/library/hashlib.html#hashlib.scrypt
    category: security
    technology:
    - pycryptodome
    - hashlib
    - md5
    subcategory:
    - vuln
    likelihood: HIGH
    impact: LOW
    confidence: MEDIUM
    seazone-promoted-from: deep-scan/python/lang/security/audit/md5-used-as-password.yaml
    seazone-promotion-rationale: >-
      Vendored upstream confidence is MEDIUM, not this ruleset's normal HIGH
      bar for pr-blocking/, and this is a `mode: taint` rule — the first
      taint-mode rule promoted into pr-blocking/ (every other promoted
      weak-hash rule so far, and the FU-B md5-hashlib exception, is a plain
      pattern/pattern-either match). Promoted anyway as a deliberate,
      reviewed exception, alongside the direct hashlib.md5/hashlib.sha1/
      hashlib.new siblings promoted in the same change, because: (1) the
      sink is narrowly scoped to call-sites whose function name matches
      /password/i, not an arbitrary sink, so it only fires when an
      MD5-derived value is actually passed into something that looks like
      password-handling code; (2) MD5-for-password-hashing is a strictly
      worse anti-pattern than bare MD5 (no salt, no work factor, trivially
      rainbow-tableable) and is exactly the kind of thing this gate exists
      to block. Documented caveat: taint-mode rules are inherently more
      complex than direct-call patterns (dataflow across assignments/calls,
      no sanitizer modeled here) and carry more FP/FN surface than the
      sibling promotions in this same change — flagged here for visibility,
      not as a reason to withhold the promotion, since local verification
      (see .pilot/canary/README.md) confirms it fires on a realistic
      hashlib.md5(...)-into-set_password(...) usage.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: hashlib.md5
      - pattern: hashlib.new(..., name="MD5", ...)
      - pattern: Cryptodome.Hash.MD5
      - pattern: Crypto.Hash.MD5
      - pattern: cryptography.hazmat.primitives.hashes.MD5
  pattern-sinks:
  - patterns:
    - pattern: $FUNCTION(...)
    - metavariable-regex:
        metavariable: $FUNCTION
        regex: (?i)(.*password.*)
