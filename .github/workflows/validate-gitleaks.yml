# Confere a config da trava de segredos: carrega no gitleaks fixado e o bloco gerado está em dia.
name: Validate gitleaks
on:
  pull_request:
    paths:
      - 'gitleaks/**'
      - '.github/workflows/validate-gitleaks.yml'
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      VERSION: "8.30.1"
      SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pin to v4.2.2
      - name: Instala o gitleaks fixado (sha256 conferido)
        run: |
          cd "$RUNNER_TEMP"  # fora do checkout: o repo pode ter uma pasta ou arquivo chamado gitleaks
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$TARBALL" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${TARBALL}"
          echo "${SHA256}  ${TARBALL}" | sha256sum -c -
          tar xzf "$TARBALL" gitleaks && sudo mv gitleaks /usr/local/bin/gitleaks
      - name: A config carrega
        run: gitleaks dir /dev/null --config gitleaks/seazone.toml --no-banner --log-level warn
      - name: O bloco "fim da chave" está em dia com a config padrão
        run: |
          curl -fsSL "https://raw.githubusercontent.com/gitleaks/gitleaks/v${VERSION}/config/gitleaks.toml" -o "$RUNNER_TEMP/padrao.toml"
          python3 gitleaks/atualizar_fim_da_chave.py "$RUNNER_TEMP/padrao.toml" "$VERSION"
          git diff --exit-code gitleaks/seazone.toml
