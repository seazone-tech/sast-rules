rules:
- id: detected-slack-webhook
  patterns:
    - pattern-regex: https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,10}/B[a-zA-Z0-9_]{8,10}/[a-zA-Z0-9_]{24}
    # Deliberately deviates from upstream's exact placeholder (which matched
    # GitHub push protection's own Slack-webhook secret pattern closely
    # enough to block this vendoring commit as a false positive). Segments
    # shortened below the detection regex's {8,10}/24-char minimums so this
    # placeholder can never be mistaken for a real webhook by any scanner,
    # while still excluding an obviously-fake example from the rule above.
    - pattern-not: https://hooks.slack.com/services/T0000/B0000/XXXXXXXXXXXXXXXXXXXXX
  languages: [regex]
  message: Slack Webhook detected
  severity: ERROR
  metadata:
    references:
    - https://api.slack.com/messaging/webhooks
    source-rule-url: https://github.com/dxa4481/truffleHogRegexes/blob/master/truffleHogRegexes/regexes.json
    category: security
    technology:
    - secrets
    - slack
    confidence: LOW
    owasp:
    - A07:2021 - Identification and Authentication Failures
    cwe:
    - 'CWE-798: Use of Hard-coded Credentials'
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
