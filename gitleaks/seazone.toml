# Regras de segredo da Seazone (gitleaks 8.30.1)
#
# Fonte única: seazone-tech/sast-rules, gitleaks/seazone.toml. O plugin `geral` do seazone-skills
# leva uma cópia (geral/lib/trava_segredos/dados/seazone-gitleaks.toml) e um teste confere que é igual.
#
# Níveis: regra com tags = ["suspeita"] é nível 2 (a trava pergunta). Sem a etiqueta, nível 1 (barra).
# Calibração (19/10/2026): 79/79 segredos e 0/39 falsos alarmes no banco Seazone; 96/96 no banco de
# formatos; nos 4.581 commits de 3 meses de 198 repos, 19 barrados (16 vazamentos prováveis) e 36 perguntas.
# 20/10: teste com os 55 vazamentos da varredura de 13/10 (barrava 44): Slack com 14 dígitos, Neon npg_,
# Smartsheet, fal.ai, Honeycomb, Pipedrive API_KEY, Cloudflare no provider.tf, .pyc e .zip (este no CLI:
# --max-archive-depth 2). E o (?i) de uma regex de allowlist vazava para as seguintes: senha com "_" em URL passava.
# 20/10 (tarde): matriz formato × lugar (67 formatos com prefixo próprio em 16 lugares + 20 sem prefixo onde o nome
# aparece), inventário dos 1.262 nomes de segredo da org e pesquisa (TruffleHog, Nosey Parker, Betterleaks, GitHub,
# GitGuardian). O que vem depois da chave passou a aceitar & < > | # * . ! ? \ / @ : e, antes do sinal, | e ].
# Regras novas para ~40 formatos (ghs_ novo do GitHub, Azure, sessão do Slack, Metabase, OneSignal, IA...).
# Entropia 3,0 (não 3,5) nas regras que aceitam hex: hex de 32 às vezes fica abaixo de 3,5 por acaso.
#
# Ao subir a versão do gitleaks: rode gitleaks/atualizar_fim_da_chave.py com a config padrão nova
# (o bloco "CORREÇÃO DO FIM DA CHAVE" no fim deste arquivo é gerado) e os testes do plugin.

title = "Seazone: regras de segredo (gitleaks 8.30.1 + ajustes)"

[extend]
useDefault = true

[[allowlists]]
description = "valor falso óbvio, em qualquer regra"
regexes = ['''(?i)abcdefghij|bcdefghijk|0123456789a|1234567890a|x{8,}|0{12,}''']

# ============ AJUSTES EM REGRAS PADRÃO ============

[[rules]]
id = "slack-user-token"
# Padrão do gitleaks aceita de 10 a 13 dígitos por bloco; na varredura de 13/10 apareceu token com 14.
regex = '''xox[pe](?:-[0-9]{8,16}){3}-[a-zA-Z0-9-]{28,34}'''

[[rules]]
id = "jwt"
tags = ["suspeita"]
regex = '''\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.(?:[a-zA-Z0-9\/\\_-]{10,}={0,2})?)(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
[[rules.allowlists]]
description = "Supabase: anon é pública; service_role tem regra própria (mensagem melhor)"
regexTarget = "match"
regexes = ['''(?:InJvbGUiOiJhbm9uI|Jyb2xlIjoiYW5vbi|icm9sZSI6ImFub24i|InJvbGUiOiJzZXJ2aWNlX3JvbGUi|Jyb2xlIjoic2VydmljZV9yb2xlI|icm9sZSI6InNlcnZpY2Vfcm9sZS)''']

[[rules]]
id = "generic-api-key"
tags = ["suspeita"]
[[rules.allowlists]]
description = "linha de imagem de container: a tag é o hash do commit"
regexTarget = "line"
regexes = ['''(?i)^\s*-?\s*image\s*:''', '''(?-i)\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/''', '''(?-i)@sha256:[a-f0-9]{64}''']
[[rules.allowlists]]
description = "NOME_DE_VARIAVEL e chaves públicas por natureza"
regexes = ['''^[A-Z][A-Z0-9_]*$''', '''^sb_publishable_''', '''^phc_''', '''^[a-z]{2,}(?:[A-Z][a-z]{2,}){1,4}[0-9]{0,2}$''']
[[rules.allowlists]]
description = "campo chamado só \"key\" (chave de lista, campo do Pipedrive, i18n) ou idempotency-key"
regexTarget = "match"
regexes = ['''(?i)^["'`]?key["'`]?\s*[:=]''', '''(?i)idempotency[_-]?key''']
[[rules.allowlists]]
description = "nomes que contêm key mas não são chave (valkey, field_key)"
regexTarget = "match"
regexes = ['''(?i)valkey|(?:field|campo)[\w.-]{0,30}key|key[_-]?(?:field|campo)''', '''(?i)l[aá]pide|terapi|copiar|cap[ií]tulo|capim|apito|mapinha|auth\.users''']

# ============ SUPABASE ============

[[allowlists]]
description = "Supabase anon (JWT legado) e chaves demo do CLI sao publicas"
targetRules = ["jwt", "supabase-service-role-jwt"]
regexes = [
  '''\.ey[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9uI|Jyb2xlIjoiYW5vbi|icm9sZSI6ImFub24i)''',
  '''\.ey[A-Za-z0-9_-]*(?:ImlzcyI6InN1cGFiYXNlLWRlbW8i|Jpc3MiOiJzdXBhYmFzZS1kZW1vI|iaXNzIjoic3VwYWJhc2UtZGVtby)''',
]

[[allowlists]]
description = "AIza publica no frontend (Firebase/Maps) - so por contexto"
targetRules = ["gcp-api-key", "generic-api-key"]
regexTarget = "line"
regexes = ['''(?i)(?:\bapiKey\s*:\s*["']AIza|(?:NEXT_PUBLIC_|VITE_|REACT_APP_|EXPO_PUBLIC_)?(?:FIREBASE|GOOGLE_MAPS|MAPS)_API_KEY\s*[=:]\s*["']?AIza)''']

[[allowlists]]
description = "chaves publicaveis de frontend"
targetRules = ["generic-api-key"]
regexes = ['''^(?:sb_publishable_|pk_(?:live|test)_|phc_)''']

[[allowlists]]
description = "chaves publicas de pagamento: Pagar.me ek_ e pk_, Stripe pk_, Mercado Pago public key"
regexes = [
  '''^ek_(?:live|test)_[A-Za-z0-9]{30}$''',
  '''^pk_(?:(?:live|test)_)?[A-Za-z0-9]{16,247}$''',
  '''^(?:APP_USR|TEST)-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[rules]]
id = "curl-auth-header"
tags = ["suspeita"]

[[rules]]
id = "curl-auth-user"
tags = ["suspeita"]

# ============ REGRAS DE PROVEDOR (pesquisa 19/10, fim da chave corrigido) ============

[[rules]]
id = "supabase-secret-key"
description = "Chave secreta do Supabase (sb_secret_): acesso total ao banco"
regex = '''\b(sb_secret_[A-Za-z0-9_-]{22}_[A-Za-z0-9_-]{8})(?:[^A-Za-z0-9_-]|$)'''
entropy = 3.0
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-access-token"
description = "Token pessoal do Supabase (sbp_): mexe em todos os projetos da pessoa"
regex = '''\b(sbp_(?:oauth_|v0_)?[a-f0-9]{40})\b'''
entropy = 3.0
keywords = ["sbp_"]

[[rules]]
id = "supabase-service-role-jwt"
description = "Chave service_role do Supabase: acesso total ao banco, passa por cima do RLS"
regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.ey[A-Za-z0-9_-]*(?:InNlcnZpY2Vfcm9sZS|JzZXJ2aWNlX3JvbGUi|ic2VydmljZV9yb2xlI)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{20,})'''
keywords = ["innlcnzpy2vfcm9szs", "jzzxj2awnlx3jvbgui", "ic2vydmljzv9yb2xli"]

[[rules]]
id = "uri-with-password"
description = "URL de conexão com a senha dentro (Postgres, MySQL, Mongo, Redis, RabbitMQ...)"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mariadb|mongodb|rediss?|amqps?|mssql|sqlserver|clickhouse|https?|ftps?|sftp|ssh|smtps?|imaps?|pop3s?|ldaps?|git|nats|kafka|elasticsearch|opensearch|neo4j|bolt|cassandra|couchdb|influxdb)(?:\+[a-z0-9]+)?://[^:/\s'"`]{0,64}:([^@/\s'"`<>{}\[\]]{6,128})@[\w.\-]+'''
secretGroup = 1
entropy = 3
keywords = ["://"]
[[rules.allowlists]]
description = "placeholders"
regexes = [
  '''(?i)^(?:pass(?:word)?|passwd|senha|secret|changeme|change_?me|example|test|root|admin|postgres|mysql|redis|guest|user(?:name)?|x{3,}|\*+|your[_-]?pass(?:word)?|my[_-]?(?:secret[_-]?)?pass(?:word)?|pwd|pw)$''',
  # (?-i): o gitleaks junta estas regex numa só; sem isso, o (?i) de cima vale aqui e "abc_Xyz123" virava molde.
  '''(?-i)^\$\(?[A-Za-z_][A-Za-z0-9_]*\)?$''',
  '''(?-i)^%\(\w+\)s$''',
  '''(?-i)^#\{\w+\}$''',
  '''(?-i)^[A-Z]+(?:_[A-Z0-9]+)+$''',
]
[[rules.allowlists]]
description = "loopback (dev local)"
regexTarget = "match"
regexes = ['''(?i)@(?:localhost|127\.0\.0\.1|0\.0\.0\.0|host\.docker\.internal)(?::\d+)?(?:[/?#]|$)''']
[[rules.allowlists]]
description = "senha de teste dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

[[rules]]
id = "jdbc-password"
description = "Senha numa URL JDBC"
regex = '''(?i)\bjdbc:[a-z0-9]+:[^\s'"`]*?[?&;]password=([^&;\s'"`<>{}\[\]$]{6,128})'''
secretGroup = 1
entropy = 3
keywords = ["jdbc:"]

[[rules]]
id = "coolify-sanctum-token"
description = "Token da API do Coolify"
regex = '''\b(\d{1,10}\|[A-Za-z0-9]{40}[a-f0-9]{8})\b'''
entropy = 3.5

[[rules]]
id = "n8n-api-key-jwt"
description = "Chave de API do n8n (JWT emitido pelo n8n)"
regex = '''\b(eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*(?:ImlzcyI6Im44bi|Jpc3MiOiJuOG4i|iaXNzIjoibjhuI)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{10,})'''
keywords = ["eyj"]

[[rules]]
id = "n8n-legacy-api-key"
description = "Chave de API do n8n (formato antigo)"
regex = '''\b(n8n_api_[a-f0-9]{80})\b'''
keywords = ["n8n_api_"]

[[rules]]
id = "anthropic-any-credential"
description = "Credencial da Anthropic (inclui o token OAuth do Claude Code)"
regex = '''\b(sk-ant-[a-z]{3,8}[0-9]{0,2}-[A-Za-z0-9_-]{80,})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.0
keywords = ["sk-ant-"]

[[rules]]
id = "gcp-gemini-auth-key"
description = "Chave do Gemini/AI Studio (AQ.)"
regex = '''\b(AQ\.Ab8R[A-Za-z0-9_-]{46})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["aq.ab8r"]

[[rules]]
id = "gcp-oauth-client-secret"
description = "Client secret de OAuth do Google (GOCSPX-)"
regex = '''\b(GOCSPX-[A-Za-z0-9_-]{28})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.0
keywords = ["gocspx-"]

[[rules]]
id = "gcp-oauth-refresh-token"
description = "Refresh token do Google: acesso contínuo a uma conta Google"
regex = '''\b(1//0[A-Za-z0-9_-]{40,})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["1//0"]

[[rules]]
id = "gcp-oauth-access-token"
description = "Access token do Google (ya29.)"
regex = '''\b(ya29\.[A-Za-z0-9_-]{60,})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["ya29."]

[[rules]]
id = "cloudflare-scannable-token"
description = "Token da Cloudflare (cfut_/cfat_/cfk_/cfast_)"
regex = '''\b(cf(?:k|ut|at|ast)_[A-Za-z0-9]{48})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["cfk_", "cfut_", "cfat_", "cfast_"]
entropy = 3.5

[[rules]]
id = "cloudflare-global-api-key-legacy"
description = "Global API key da Cloudflare"
regex = '''(?i)(?:(?:cloudflare|\bcf)[\w.-]{0,20}?(?:api|global|auth)[_.-]?key|x-auth-key)[\s'"\]]{0,4}(?:=|:|=>|:=)[\s'"]{0,5}([a-f0-9]{37,45})(?:[^a-z0-9]|$)'''
secretGroup = 1
keywords = ["cloudflare", "cf_", "x-auth-key"]
entropy = 3

[[rules]]
id = "cloudflare-tunnel-token"
description = "Token de túnel da Cloudflare"
regex = '''\b(eyJhIjoi[A-Za-z0-9+/]{100,}={0,2})'''
keywords = ["eyjhijoi"]
entropy = 4

[[rules]]
id = "github-app-installation-token-jwt"
description = "Token de instalação de GitHub App (ghs_)"
regex = '''\b(ghs_[A-Za-z0-9]{1,40}_eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{16,})'''
keywords = ["ghs_"]
entropy = 4

[[rules]]
id = "aws-secret-access-key"
description = "Secret access key da AWS"
regex = '''(?i)(?:aws)?[_.-]?secret[_.-]?(?:access)?[_.-]?key['"]?[\s'"\]]{0,4}(?:=|:|=>|:=|\|)[\s'"]{0,5}([A-Za-z0-9/+]{40})(?:[^A-Za-z0-9/+=]|$)'''
secretGroup = 1
keywords = ["secret_access_key", "secretaccesskey", "secret-access-key", "aws_secret"]
entropy = 4
[[rules.allowlists]]
regexes = ['''EXAMPLEKEY$''']

[[rules]]
id = "aws-session-token"
description = "Session token da AWS"
regex = '''\b((?:IQoJb3JpZ2luX2Vj|FwoGZXIvYXdz)[A-Za-z0-9/+]{100,}={0,2})'''
keywords = ["iqojb3jpz2lux2vj", "fwogzxivyxdz"]
entropy = 4

[[rules]]
id = "docker-hub-access-token"
description = "Token do Docker Hub"
regex = '''\b(dckr_(?:pat|oat)_[A-Za-z0-9_-]{27,40})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["dckr_pat_", "dckr_oat_"]
entropy = 3

[[rules]]
id = "vercel-prefixed-token"
description = "Token da Vercel"
regex = '''\b(vc[piark]_[A-Za-z0-9_-]{24,})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["vcp_", "vci_", "vca_", "vcr_", "vck_"]
entropy = 4

[[rules]]
id = "railway-token"
description = "Token da Railway"
regex = '''(?i)(?:railway[\w.-]{0,30}?(?:token|key|secret)[\w.-]{0,10}|project-access-token)[\s'"\]]{0,4}(?:=|:|=>|:=)[\s'"]{0,5}([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
keywords = ["railway", "project-access-token"]

[[rules]]
id = "pypi-token-any-index"
description = "Token do PyPI"
regex = '''\b(pypi-AgE[A-Za-z0-9_-]{80,})'''
keywords = ["pypi-"]
entropy = 3.5

[[rules]]
id = "hubspot-private-app-token"
description = "Token de app privado do HubSpot"
regex = '''\b(pat-[a-z]{2}[0-9]-[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\b'''
keywords = ["pat-"]

[[rules]]
id = "pipedrive-api-token"
description = "Token da API do Pipedrive"
regex = '''(?i)(?:pipedrive[\w.-]{0,20}?(?:api[_.-]?)?(?:token|key)[\w.-]{0,10}?[\s'"\]]{0,4}(?:=|:|=>|:=|,|\|)[\s'"]{0,5}([a-f0-9]{40})|x-api-token[\s'"\]]{0,4}:[\s'"\]]{0,4}([a-f0-9]{40})|pipedrive\.com/[^\s'"]*?[?&]api_token=([a-f0-9]{40}))(?:[\x60'"\s;&]|\\[nr]|$)'''
keywords = ["pipedrive", "x-api-token"]
entropy = 3

[[rules]]
id = "resend-api-key"
description = "Chave do Resend"
regex = '''\b(re_[1-9A-HJ-NP-Za-km-z]{8}_[1-9A-HJ-NP-Za-km-z]{24})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["re_"]
entropy = 3.5

[[rules]]
id = "sentry-app-integration-token"
description = "Token de integração do Sentry"
regex = '''\b(sntry[ai]_[a-f0-9]{64})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["sntrya_", "sntryi_"]
entropy = 3.5

[[rules]]
id = "posthog-secret-key"
description = "Chave secreta do PostHog (phx_/phs_)"
regex = '''\b(ph[xsar]_[A-Za-z0-9_-]{40,52})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["phx_", "phs_", "pha_", "phr_"]
entropy = 3.5

[[rules]]
id = "notion-legacy-secret"
description = "Token do Notion (formato antigo secret_)"
regex = '''\b(secret_[A-Za-z0-9]{43})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["secret_"]
entropy = 4

[[rules]]
id = "atlassian-api-token-v2"
description = "Token da API da Atlassian"
regex = '''\b(AT[AC]TT3[A-Za-z0-9_=-]{100,300}=[A-Za-z0-9]{8})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["atatt3", "atctt3"]
entropy = 3.5

[[rules]]
id = "figma-token"
description = "Token do Figma"
regex = '''\b(fig[dp]_[A-Za-z0-9_=-]{38,54})(?:[\x60'"\s;,)]|\\[nr]|$)'''
keywords = ["figd_", "figp_"]
entropy = 3.5

[[rules]]
id = "datadog-prefixed-key"
description = "Chave do Datadog"
regex = '''\b(ddapp_[A-Za-z0-9]{34}|dd(?:pat|sat)_[A-Za-z0-9]{8,40}_[A-Za-z0-9]{30,90})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["ddapp_", "ddpat_", "ddsat_"]
entropy = 3.5

[[rules]]
id = "datadog-api-app-key"
description = "Chave do Datadog"
regex = '''(?i)[\w.-]{0,50}?(?:datadog|\bdd)[_.-]?(?:api|app(?:lication)?)[_.-]?key(?:[ \t\w.-]{0,20})[\s'"\]]{0,4}(?:=|>|:{1,3}=|\|\|?|:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{40}|[a-f0-9]{32})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
secretGroup = 1
keywords = ["datadog", "dd_api", "dd-api", "dd_app", "dd-app"]
entropy = 3

[[rules]]
id = "doppler-token"
description = "Token do Doppler"
regex = '''\b(dp\.(?:ct|pt|sa|said|scim|audit)\.[A-Za-z0-9]{40,44}|dp\.st\.(?:[a-z0-9_-]{2,35}\.)?[A-Za-z0-9]{40,44})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["dp.ct.", "dp.pt.", "dp.st.", "dp.sa.", "dp.said.", "dp.scim.", "dp.audit."]
entropy = 3

[[rules]]
id = "asaas-api-key"
description = "Chave da API do Asaas (cobranças)"
regex = '''(\$?aact_(?:prod_|hmlg_)?[A-Za-z0-9+/]{80,250}={0,2})'''
keywords = ["aact_"]
entropy = 4.0

[[rules]]
id = "mercadopago-access-token"
description = "Access token do Mercado Pago"
regex = '''\b((?:APP_USR|TEST)-\d{6,19}-\d{6}-[a-f0-9]{24,40}-\d{6,12})\b'''
keywords = ["app_usr-", "test-"]
entropy = 3.0

[[rules]]
id = "mercadolivre-refresh-token"
description = "Refresh token do Mercado Pago/Mercado Livre"
regex = '''\b(TG-[a-f0-9]{24}-\d{6,12})\b'''
keywords = ["tg-"]
entropy = 3.0

[[rules]]
id = "pagarme-v4-api-key"
description = "Chave secreta do Pagar.me"
regex = '''\b(ak_(?:live|test)_[A-Za-z0-9]{30})\b'''
keywords = ["ak_live_", "ak_test_"]
entropy = 3.5

[[rules]]
id = "pagarme-v5-secret-key"
description = "Chave secreta do Pagar.me"
regex = '''\b(sk_(?:test_)?[A-Za-z0-9]{16,32})\b'''
keywords = ["sk_"]
entropy = 3.5
[[rules.allowlists]]
regexes = ['''^sk_[A-Za-z]+$''']

[[rules]]
id = "stripe-key-long"
description = "Chave secreta da Stripe"
regex = '''\b((?:sk|rk)_(?:live|test|org)_[A-Za-z0-9_]{20,247})(?:[^A-Za-z0-9_]|$)'''
keywords = ["sk_live", "rk_live", "sk_test", "rk_test", "sk_org"]
entropy = 3.0

[[rules]]
id = "stripe-webhook-secret"
description = "Segredo de webhook da Stripe (whsec_)"
regex = '''\b(whsec_[A-Za-z0-9+/]{32,88}={0,2})'''
keywords = ["whsec_"]
entropy = 3.0

[[rules]]
id = "iugu-api-token"
description = "Token da API da Iugu"
regex = '''(?i)[\w.-]{0,50}?iugu(?:[ \t\w.-]{0,20})[\s'"\]]{0,4}(?:=|>|:{1,3}=|\|\|?|:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{32,64})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["iugu"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)account[_.-]?id''']

[[rules]]
id = "zapi-instance-url"
description = "Token da Z-API (WhatsApp) na URL"
regex = '''(?i)api\.z-api\.io/instances/[0-9a-f]{32}/token/([0-9a-f]{24})'''
secretGroup = 1
keywords = ["z-api.io"]

[[rules]]
id = "zapi-client-token"
description = "Client-Token da Z-API (WhatsApp)"
regex = '''(?i)(?:z-?api[\w.-]{0,20})?client[_-]?token["']?\s*[:=]\s*["']?([A-Za-z0-9]{32,36})\b'''
keywords = ["client-token", "client_token", "clienttoken"]
entropy = 3.5
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)facebook[_.-]?client[_.-]?token''']

[[rules]]
id = "evolution-api-key"
description = "Chave da Evolution API (WhatsApp)"
regex = '''(?:AUTHENTICATION_API_KEY["']?\s*[:=]\s*["']?([A-Za-z0-9_\-]{16,128})(?:["'\s,;]|$)|["']?apikey["']?\s*[:=]\s*["']([0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12})["'])'''
keywords = ["authentication_api_key", "apikey"]
entropy = 3.0

[[rules]]
id = "meta-access-token"
description = "Access token da Meta/WhatsApp (EAA)"
regex = '''(?:^|[^A-Za-z0-9+/])(EAA[A-Za-z0-9]{50,})(?:[^A-Za-z0-9+/=]|$)'''
keywords = ["eaa"]
entropy = 4.0

[[rules]]
id = "twilio-auth-token"
description = "Credencial do Twilio"
regex = '''(?i)(?:twilio[\w.-]{0,20}(?:auth[_-]?token|secret)|auth_token|api_secret)["'\]]{0,3}\s*[:=|]\s*["']?([a-z0-9]{32})\b'''
keywords = ["twilio"]

[[rules]]
id = "zapi-instance-token-env"
description = "Token de instância da Z-API (WhatsApp)"
regex = '''(?i)z-?api[\w.-]{0,20}token["']?\s*[:=]\s*["']?([0-9a-f]{24})\b'''
keywords = ["zapi", "z-api", "z_api"]

[[rules]]
id = "twilio-credential-pair"
description = "Credencial do Twilio"
regex = '''\b(?:AC[a-f0-9]{32}["']?\s*,\s*["']([a-f0-9]{32})|SK[a-f0-9]{32}["']?\s*,\s*["']([A-Za-z0-9]{32}))["']'''
keywords = ["twilio"]

[[rules]]
id = "composio-api-key"
description = "Chave da Composio"
regex = '''(?i)composio[\w.-]{0,30}[\s'"\]]{0,4}(?:=|:|=>)[\s'"]{0,5}(u?ak_[A-Za-z0-9_-]{16,})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
keywords = ["composio"]
entropy = 3

[[rules]]
id = "openrouter-api-key"
description = "Chave do OpenRouter"
regex = '''\b(sk-or-v1-[0-9a-f]{64})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.0
keywords = ["sk-or-v1-"]

# ============ REGRAS SEAZONE ============

[[rules]]
id = "senha-no-codigo"
description = "Senha escrita direto no código"
regex = '''(?:(?i:\b(?:[\w.-]{0,40}[_.-])?(?:senha|password|passwd|pwd|passphrase)(?:[_.-][\w.-]{0,20})?)|\b[a-z][a-zA-Z0-9]{0,40}(?:Senha|Password|Passwd|Pwd|Passphrase)(?:[A-Z_][\w]{0,20})?)["'\]]{0,3}\s*(?:=|:|:=|=>)\s*["'`]([^"'`\s]{8,128})["'`]'''
entropy = 3.0
keywords = ["senha", "password", "passwd", "pwd", "passphrase"]
[[rules.allowlists]]
description = "referência, template ou hash (não é a senha)"
regexes = [
  '''^(?:\$|\{|<|%|\[|/)''',
  '''\$\{|\{\{|\}\}''',
  '''^[A-Z][A-Z0-9_]*$''',
  '''^[a-z0-9]+(?:[-_.][a-z0-9]+)+$''',
  '''^(?:\$2[aby]\$|\$argon2|pbkdf2|sha256:|scrypt:)''',
]
[[rules.allowlists]]
description = "molde óbvio (o valor INTEIRO é exemplo, não basta conter a palavra)"
regexes = [
  '''(?i)^(?:password|senha|passwd|changeme|change_me|secret|segredo|example|exemplo|placeholder|dummy|fake|redacted|null|none|undefined|string|vazio)\d{0,3}$''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|<[^>]+>|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo)''',
]
[[rules.allowlists]]
description = "senha de teste dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

# ============ IA / LLM ============

[[rules]]
id = "chave-sk"
description = "Chave de API no formato sk-… (hub LiteLLM da Seazone, OpenRouter, OpenAI, DeepSeek…)"
regex = '''\b(sk-[A-Za-z0-9_-]{20,200})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["sk-"]
[[rules.allowlists]]
description = "Anthropic tem regra própria; placeholders"
regexes = ['''^sk-ant-''', '''^sk-[a-z]+(?:-[a-z0-9]+)+$''', '''^sk-[A-Z]+(?:[-_][A-Z0-9]+)+$''', '''(?i)^sk-(?:your|xxx|example|placeholder|test|fake|dummy|insert|replace|sua|seu|change)''', '''(?i)(?:test|teste|fake|dummy|example|exemplo|sample|placeholder|definitely|nunca|invalid|invalida)''']

[[rules]]
id = "mcp-config-com-chave"
description = "Config de MCP com a chave escrita direto (use ${VARIAVEL})"
path = '''(?i)(?:^|/)(?:\.mcp\.json|mcp\.json|claude_desktop_config\.json)$'''
regex = '''(?i)"[\w-]*(?:authorization|key|token|secret|password|bearer)[\w-]*"\s*:\s*"(?:Bearer\s+)?([^"\s$]{12,})"'''
keywords = ["authorization", "key", "token", "secret", "password", "bearer"]

