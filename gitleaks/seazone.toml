# ============ MATRIZ DE COBERTURA (20/10: cada formato em cada lugar onde a chave aparece) ============

[[rules]]
id = "groq-api-key"
description = "Chave da API da Groq"
regex = '''\b(gsk_[A-Za-z0-9]{52})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["gsk_"]

[[rules]]
id = "deepl-api-key-free"
description = "Chave da API do DeepL (plano gratuito, termina em :fx)"
regex = '''\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}:fx)(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = [":fx"]

[[rules]]
id = "deepl-api-key"
description = "Chave da API do DeepL (perto da palavra deepl)"
regex = '''(?i)deepl[\w .:-]{0,40}?(?:key|token|chave|auth)[\w .-]{0,10}?[\s'"\x60\]|]{0,5}(?:=|:|=>|:=|\|)?[\s'"\x60|]{0,5}([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["deepl"]

[[rules]]
id = "discord-webhook"
description = "Webhook do Discord (quem tem a URL posta no canal)"
regex = '''(https://(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9_-]{60,80})'''
keywords = ["discord"]

[[rules]]
id = "telegram-bot-token-formato"
description = "Token de bot do Telegram (numero:AA...)"
regex = '''\b(\d{8,10}:AA[A-Za-z0-9_-]{33})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = [":aa"]

[[rules]]
id = "resend-api-key"
description = "Chave da API do Resend (re_)"
regex = '''\b(re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{20,})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["re_"]

[[rules]]
id = "senha-sem-aspas"
description = "Senha sem aspas em .env, YAML, docker-compose ou properties"
regex = '''(?im)^[ \t]*(?:-[ \t]+)?(?:export[ \t]+)?["']?[A-Za-z_][\w.-]{0,60}?(?:password|passwd|passphrase|senha|pwd)(?:[_.-]?\d{1,2})?["']?[ \t]*[=:][ \t]*([^\s'"\x60$#{<%][^\s'"\x60]{7,127})[ \t]*$'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "passphrase", "senha", "pwd"]
[[rules.allowlists]]
description = "molde óbvio ou referência"
regexes = [
  '''(?i)^(?:password|senha|passwd|changeme|change_me|secret|segredo|example|exemplo|placeholder|dummy|fake|redacted|null|none|undefined|string|vazio|true|false)\d{0,3}$''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo)''',
  '''(?-i)^[a-z]+://''',
  '''(?-i)^(?:/|\./|~)''',
]
[[rules.allowlists]]
description = "referência, não o valor: caminho do SSM, variável de ambiente, atributo de config, nome em maiúsculas, texto de exemplo"
regexes = [
  '''(?-i)^/''',
  '''(?-i)^(?:process\.env|import\.meta\.env|os\.environ|os\.getenv|Deno\.env|settings|config|cfg|env|self|this|local|var|_s)\b''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\??\.[A-Za-z_][A-Za-z0-9_]*)+[,;)]?$''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\[\d+\])?(?:\.[A-Za-z_][A-Za-z0-9_]*(?:\[\d+\])?)+$''',
  '''(?-i)^[A-Z][A-Z0-9_]*=?$''',
  '''(?-i)^[-_]?[a-z]+(?:[-_.][a-z]+)+[.(]?$''',
  '''(?-i)^[a-z]{2,}(?:[A-Z][a-z]{2,})+[0-9]{0,2}[.(]?$''',
  '''(?-i)^!|[(),;]$''',
]
[[rules.allowlists]]
description = "nome que contém key mas não é chave"
regexTarget = "match"
regexes = ['''(?i)valkey''']
[[rules.allowlists]]
description = "senha de teste dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)\.github/workflows/|(?:^|/)[\w-]*e2e[\w-]*/|(?:^|/)(?:tests?|__tests__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

