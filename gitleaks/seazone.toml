id = "yandex-access-token"
regex = '''(?i)[\w.-]{0,50}?(?:yandex)(?:[ \t\w.-]{0,20})[\s'"\]]{0,4}(?:=|>|:{1,3}=|\|\|?|:|=>|\?=|,)[\x60'"\s=]{0,5}(t1\.[A-Z0-9a-z_-]+[=]{0,2}\.[A-Z0-9a-z_-]{86}[=]{0,2})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
[[rules]]
