[[rules]]
id = "chave-de-servico-da-seazone"
description = "Chave de um serviço que a Seazone usa (formato sem prefixo, reconhecido pelo nome)"
regex = '''(?i)\b[\w.-]{0,30}?(?:\b|[_.-])(?:nekt|stays|btg|clicksign|baserow|omie|z-?api|sapron|timelines|tuna|sieg|convenia|newbyte|pipefy|blip|rd[_-]?station|sienge|minimax|lovable|fleet|keycloak|sia|spotsys|olimpo|oraculo|alfred|taskdex|seazone)[\w.-]{0,30}?(?:token|key|secret|chave|senha|password|passwd|auth|credential)[\w.-]{0,15}?["'\]]{0,3}[ \t]*(?:=|:|=>|:=|\|)[ \t]*["'\x60]?(?:Bearer\s+)?([A-Za-z0-9_\-+/=.:]{20,300})["'\x60]?(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
secretGroup = 1
entropy = 3.0  # hex de 32 tem no máximo 4,0 e às vezes fica abaixo de 3,5: perderia chave real
keywords = ["nekt", "stays", "btg", "clicksign", "baserow", "omie", "zapi", "z-api", "sapron", "timelines", "tuna", "sieg", "convenia", "newbyte", "pipefy", "blip", "rd_station", "rd-station", "rdstation", "sienge", "minimax", "lovable", "fleet", "keycloak", "sia", "spotsys", "olimpo", "oraculo", "alfred", "taskdex", "seazone"]
[[rules.allowlists]]
description = "molde, referência ou valor público"
regexes = [
  '''(?i)^(?:\$|\{|<|%)''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo|dummy|fake)''',
  '''(?-i)^[A-Z][A-Z0-9_]*$''',
  '''(?-i)^[a-z]+://''',
  '''(?-i)^(?:sb_publishable_|phc_|pk_(?:live|test)_)''',
  '''(?-i)\.ey[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9uI|Jyb2xlIjoiYW5vbi|icm9sZSI6ImFub24i)''',
]
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)\.github/workflows/|(?:^|/)[\w-]*e2e[\w-]*/|(?:^|/)(?:tests?|__tests__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']
[[rules.allowlists]]
description = "referência, não o valor: caminho do SSM, variável de ambiente, atributo de config, nome em maiúsculas, texto de exemplo"
regexes = [
  '''(?-i)^/''',
  '''(?-i)^(?:process\.env|import\.meta\.env|os\.environ|os\.getenv|Deno\.env|settings|config|cfg|env|self|this|local|var|_s)\b''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\??\.[A-Za-z_][A-Za-z0-9_]*)+[,;)]?$''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\[\d+\])?(?:\.[A-Za-z_][A-Za-z0-9_]*(?:\[\d+\])?)+$''',
  '''(?-i)^[A-Z][A-Z0-9_]*=?$''',
  '''(?-i)^[-_]?[a-z]+(?:[-_.][a-z]+)+[.(]?$''',
  '''(?-i)^[a-z]{2,}(?:[A-Z][a-z]{2,})+[0-9]{0,2}[.(]?$''',
  '''(?-i)^!|[(),;]$''',
]
[[rules.allowlists]]
description = "nome que contém key mas não é chave"
regexTarget = "match"
regexes = ['''(?i)valkey''']

