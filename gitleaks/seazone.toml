entropy = 3.0
keywords = ["honeycomb"]

[[rules]]
id = "cloudflare-terraform-provider"
description = "Token da Cloudflare no provider do Terraform"
regex = '''(?i)provider\s+"cloudflare"\s*\{[^}]{0,600}?\bapi_(?:token|key)\s*=\s*"([A-Za-z0-9_-]{37,40})"'''
keywords = ["cloudflare"]

# ============ ARQUIVOS QUE NUNCA VÃO PRO GIT (pelo nome) ============

[[rules]]
id = "arquivo-claude-settings-local"
description = "Config pessoal do Claude Code (.claude/settings.local.json): é só da sua máquina"
path = '''(?:^|/)\.claude/settings\.local\.json$'''

[[rules]]
id = "arquivo-python-compilado"
description = "Python compilado (.pyc, __pycache__/): o gitleaks não lê binário, e ele pode levar chave junto"
path = '''(?:^|/)__pycache__/|\.py[co]$'''

[[rules]]
id = "arquivo-env-local"
description = ".env.local é só da sua máquina"
path = '''(?:^|/)\.env(?:\.[\w-]+)?\.local$'''

[[rules]]
id = "arquivo-tfstate"
description = "Estado do Terraform guarda senhas em texto puro"
path = '''(?:^|/)[^/]*\.tfstate(?:\.backup)?$'''

[[rules]]
id = "arquivo-kubeconfig"
description = "kubeconfig pelo nome (o do EKS costuma não ter segredo; confira)"
tags = ["suspeita"]
path = '''(?:^|/)(?:\.kube/config|kubeconfig(?:[-_.][\w-]+)?(?:\.ya?ml)?)$'''

[[rules]]
id = "arquivo-chave-ssh"
description = "Chave SSH privada"
path = '''(?:^|/)id_(?:rsa|dsa|ecdsa|ed25519)(?:_sk)?$'''

[[rules]]
id = "arquivo-chave-putty"
description = "Chave privada do PuTTY"
path = '''(?i)\.ppk$'''


# ============ ARQUIVOS QUE NUNCA VÃO PRO GIT (lista ampliada) ============

[[rules]]
id = "arquivo-credencial-de-maquina"
description = "Arquivo de credencial da sua máquina (.netrc, .git-credentials, cofre KeePass, .htpasswd)"
path = '''(?i)(?:^|/)(?:\.netrc|_netrc|\.git-credentials|[^/]+\.kdbx|\.htpasswd)$'''

[[rules]]
id = "arquivo-historico-de-terminal"
description = "Histórico de terminal/banco costuma ter senha digitada"
path = '''(?:^|/)\.(?:bash|zsh|sh|psql|mysql|python|node_repl|sqlite|rediscli)_history$'''

[[rules]]
id = "arquivo-sessao-de-navegador"
description = "Sessão salva do Playwright: tem cookie e token de login"
path = '''(?i)(?:^|/)playwright/\.auth/'''

[[rules]]
id = "arquivo-gravacao-har"
description = "Gravação de navegador (.har): costuma ter cookie e token de login"
path = '''(?i)\.har$'''
tags = ["suspeita"]

[[rules]]
id = "arquivo-dump-de-banco"
description = "Dump de banco de dados (dados de cliente não vão pro git)"
path = '''(?i)\.dump$'''

[[rules]]
id = "arquivo-banco-ou-backup"
description = "Arquivo de banco ou backup (.sqlite, .db, .bak): confira se não tem dado de cliente"
path = '''(?i)\.(?:sqlite3?|db|bak)$'''
tags = ["suspeita"]

[[rules]]
id = "conteudo-dump-postgres"
description = "Dump do Postgres (dados de cliente não vão pro git)"
regex = '''(?m)^(?:-- PostgreSQL database dump|COPY [\w."]+ \([^)]*\) FROM stdin;)'''
keywords = ["postgresql database dump", "from stdin;"]

[[rules]]
id = "k8s-secret-stringdata"
description = "Secret do Kubernetes com valor escrito (use ExternalSecret)"
regex = '''(?i)\bkind:[ \t]*["']?secret["']?(?s:.){0,300}?\bstringData:[ \t]*\n(?:[ \t]+[\w.-]+:[^\n]*\n){0,20}?[ \t]+[\w.-]+:[ \t]*["']?([^\s"'{}$|>][^\s"']{5,})'''
path = '''(?i)\.ya?ml$'''
keywords = ["stringdata"]

[[rules]]
id = "npmrc-pypirc-docker-token"
description = "Token escrito em .npmrc/.pypirc/.docker/config.json (use variável de ambiente)"
path = '''(?i)(?:^|/)(?:\.npmrc|\.pypirc|\.docker/config\.json)$'''
regex = '''(?i)(?:_authToken\s*=\s*|password\s*[=:]\s*|"auth"\s*:\s*")([^\s"$][^\s"]{10,})'''
keywords = ["_authtoken", "password", "auth"]

[[rules]]
id = "kubeconfig-chave-cliente"
description = "Chave de cliente de kubeconfig (dá acesso ao cluster)"
regex = '''\bclient-key-data:[ \t]*([A-Za-z0-9+/=]{100,})'''
keywords = ["client-key-data"]

[[rules]]
id = "variavel-publica-com-segredo"
description = "Variável pública (VITE_/NEXT_PUBLIC_/…) com nome de segredo: o valor vai parar no navegador"
regex = '''\b(?:VITE|NEXT_PUBLIC|REACT_APP|EXPO_PUBLIC)_[A-Z0-9_]*(?:SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|PASSWD)[A-Z0-9_]*["']?\s*[=:]\s*["']?([^\s"'$]{8,})'''
keywords = ["vite_", "next_public_", "react_app_", "expo_public_"]

