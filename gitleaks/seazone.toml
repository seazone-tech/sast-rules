id = "jina-api-key"
description = "Chave da API da Jina (jina_)"
regex = '''\b(jina_[A-Za-z0-9_-]{55,80})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["jina_"]

[[rules]]
id = "langsmith-api-key"
description = "Chave da API do LangSmith (lsv2_)"
regex = '''\b(lsv2_(?:pt|sk)_[a-f0-9]{32}_[a-f0-9]{10})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["lsv2_"]

[[rules]]
id = "pinecone-api-key"
description = "Chave da API do Pinecone (pcsk_)"
regex = '''\b(pcsk_[A-Za-z0-9]{4,10}_[A-Za-z0-9]{50,80})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["pcsk_"]

[[rules]]
id = "replicate-api-token"
description = "Token da API do Replicate (r8_)"
regex = '''\b(r8_[A-Za-z0-9]{37})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["r8_"]

[[rules]]
id = "slack-sessao"
description = "Token de sessão ou cookie do Slack (xoxc-/xoxd-): dá acesso como a pessoa"
regex = '''\b(xox[cd]-[A-Za-z0-9%-]{40,300})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["xoxc-", "xoxd-"]

[[rules]]
id = "zapier-webhook"
description = "Webhook do Zapier (quem tem a URL dispara o zap)"
regex = '''(https://hooks\.zapier\.com/hooks/catch/\d+/[A-Za-z0-9]+/?)'''
keywords = ["hooks.zapier.com"]

[[rules]]
id = "elastic-api-key"
description = "Chave da API da Elastic (essu_)"
regex = '''\b(essu_[A-Za-z0-9+/=_-]{40,200})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["essu_"]

[[rules]]
id = "mailersend-api-key"
description = "Chave da API da MailerSend (mlsn.)"
regex = '''\b(mlsn\.[a-f0-9]{64})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["mlsn."]

[[rules]]
id = "zoho-token"
description = "Token OAuth da Zoho (1000.hex.hex)"
regex = '''\b(1000\.[a-f0-9]{32}\.[a-f0-9]{32})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["1000."]

[[rules]]
id = "clickup-api-token"
description = "Token da API do ClickUp (pk_)"
regex = '''\b(pk_\d{6,10}_[A-Z0-9]{32})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
keywords = ["pk_"]

[[rules]]
id = "azure-storage-account-key"
description = "Chave de conta do Azure Storage (AccountKey=)"
regex = '''(?i)AccountKey=([A-Za-z0-9+/]{86}==)'''
keywords = ["accountkey="]

[[rules]]
id = "azure-shared-access-key"
description = "Chave de acesso compartilhado do Azure (Service Bus/Event Hubs)"
regex = '''(?i)SharedAccessKey=([A-Za-z0-9+/]{43}=)'''
keywords = ["sharedaccesskey="]

[[rules]]
id = "azure-sas-token"
description = "URL do Azure Storage com assinatura SAS (sig=)"
regex = '''(?i)https://[\w.-]+\.(?:blob|file|queue|table|dfs)\.core\.windows\.net/[^\s'\"]*?[?&]sig=([A-Za-z0-9%+/]{30,}(?:%3D|=){0,2})'''
keywords = ["windows.net"]

[[rules]]
id = "chave-por-nome-de-provedor"
description = "Chave de API de um provedor conhecido, reconhecida pelo nome (formato sem prefixo)"
regex = '''(?i)\b[\w.-]{0,30}?(?:\b|[_.-])(?:azure[_-]?openai|openai|anthropic|mistral|postmark|brave|deepseek|cohere|perplexity|together|fireworks|voyage|assemblyai|deepgram|elevenlabs|datadog|mailgun|mailchimp|mandrill|sendinblue|brevo|hubspot|intercom|zendesk|freshdesk|trello|asana|monday|airtable|typeform|shopify|vtex|bling|algolia|mapbox|twilio|vonage|zenvia|onesignal|firebase[_-]?server|fcm[_-]?server|apple|google[_-]?maps|recaptcha[_-]?secret|hcaptcha[_-]?secret)[\w.-]{0,30}?(?:token|key|secret|chave|password|auth)[\w.-]{0,15}?["'\]]{0,3}[ \t]*(?:=|:|=>|:=|\|)[ \t]*["'\x60]?(?:Bearer\s+)?([A-Za-z0-9_\-+/=.:]{16,300})[\"'\x60]?(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.0  # hex de 32 tem no máximo 4,0 e às vezes fica abaixo de 3,5: perderia chave real
keywords = ["openai", "anthropic", "mistral", "postmark", "brave", "deepseek", "cohere", "perplexity", "together", "fireworks", "voyage", "assemblyai", "deepgram", "elevenlabs", "datadog", "mailgun", "mailchimp", "mandrill", "sendinblue", "brevo", "hubspot", "intercom", "zendesk", "freshdesk", "trello", "asana", "monday", "airtable", "typeform", "shopify", "vtex", "bling", "algolia", "mapbox", "twilio", "vonage", "zenvia", "onesignal", "firebase", "fcm", "apple", "maps", "recaptcha", "hcaptcha"]
[[rules.allowlists]]
description = "referência ou molde, não o valor"
regexes = [
  '''(?-i)^(?:\$|\{|<|%|/)''',
  '''(?-i)^(?:process\.env|import\.meta\.env|os\.environ|os\.getenv|Deno\.env|settings|config|cfg|env|self|this|local|var|_s)\b''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\??\.[A-Za-z_][A-Za-z0-9_]*)+[,;)]?$''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\[\d+\])?(?:\.[A-Za-z_][A-Za-z0-9_]*(?:\[\d+\])?)+$''',
  '''(?-i)^[A-Z][A-Z0-9_]*=?$''',
  '''(?-i)^[-_]?[a-z]+(?:[-_.][a-z]+)+[.(]?$''',
  '''(?-i)^[a-z]{2,}(?:[A-Z][a-z]{2,})+[0-9]{0,2}[.(]?$''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo|dummy|fake)''',
]
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|__fixtures__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']
[[rules.allowlists]]
description = "nome que só descreve ou é público (id, url, chave de site, chave publicável)"
regexTarget = "match"
regexes = ['''(?i)(?:_ID|_URL|_URI|_NAME|_HOST|_DOMAIN|_REGION|PUBLISHABLE|PUBLIC|SITE_KEY|SITEKEY|_TTL|_HEADER)[\w.-]{0,15}?["'\]]{0,3}[ \t]*(?:=|:|=>|:=|\|)''']

[[rules]]
id = "par-nome-valor"
description = "Segredo em par nome/valor (coleção do Postman, captura HAR, log de requisição)"
regex = '''(?i)"(?:key|name)"\s*:\s*"[\w.-]{0,40}?(?:api[_-]?key|token|secret|password|senha|authorization|auth|access[_-]?key|client[_-]?secret|cookie|session)[\w.-]{0,20}"\s*,\s*"value"\s*:\s*"((?:Bearer\s+|Basic\s+)?[^"\s]{12,500})\"'''
entropy = 3.0  # hex de 32 tem no máximo 4,0 e às vezes fica abaixo de 3,5: perderia chave real
keywords = ["value"]
[[rules.allowlists]]
description = "variável do Postman ({{nome}}) ou molde"
regexes = ['''(?i)^(?:Bearer\s+|Basic\s+)?\{\{''', '''(?i)(?:x{3,}|\*{3,}|your[_-]|placeholder|example|exemplo|<[^>]+>)''']
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|__fixtures__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

[[rules]]
id = "generico-em-portugues"
description = "Chave ou segredo com nome em português (chave, segredo, credencial)"
tags = ["suspeita"]
regex = '''(?i)\b[\w.-]{0,40}?(?:chave|segredo|credencial|token[_-]?de[_-]?acesso)[\w.-]{0,20}?["'\]]{0,3}[ \t]*(?:=|:|=>|:=|\|)[ \t]*["'\x60]?([A-Za-z0-9_\-+/=.:!@#$%^&*]{16,200})[\"'\x60]?(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
entropy = 3.5
keywords = ["chave", "segredo", "credencial", "token_de_acesso", "token-de-acesso"]
[[rules.allowlists]]
description = "referência ou molde, não o valor"
regexes = [
  '''(?-i)^(?:\$|\{|<|%|/)''',
  '''(?-i)^(?:process\.env|import\.meta\.env|os\.environ|os\.getenv|Deno\.env|settings|config|cfg|env|self|this|local|var|_s)\b''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\??\.[A-Za-z_][A-Za-z0-9_]*)+[,;)]?$''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\[\d+\])?(?:\.[A-Za-z_][A-Za-z0-9_]*(?:\[\d+\])?)+$''',
  '''(?-i)^[A-Z][A-Z0-9_]*=?$''',
  '''(?-i)^[-_]?[a-z]+(?:[-_.][a-z]+)+[.(]?$''',
  '''(?-i)^[a-z]{2,}(?:[A-Z][a-z]{2,})+[0-9]{0,2}[.(]?$''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo|dummy|fake)''',
]
[[rules.allowlists]]
description = "valor sem dígito é nome de campo ou texto, não chave"
regexes = ['''(?-i)^[A-Za-z_/.\-]+$''', '''(?-i)^[^@\s]+@[^@\s]+\.[a-z]{2,}(?:\.[a-z]{2})?$''', '''(?-i)^[a-z0-9]*[_:.-][a-z0-9_:.-]*$''']
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|__fixtures__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

[[rules]]
id = "segredo-em-arquivo-env"
description = "Chave, token ou senha num arquivo .env versionado"
path = '''(?i)(?:^|/)(?:\.env(?:\.[\w-]+)?|[\w-]+\.env)$'''
regex = '''(?im)^[ \t]*(?:export[ \t]+)?["']?[A-Za-z_][\w.-]{0,60}?(?:key|token|secret|senha|password|passwd|pwd|credential|auth|dsn)(?:[_.-]?\d{1,2})?["']?[ \t]*=[ \t]*["']?([^\s'"\x60$#{<%][^\s'"\x60]{11,300})["']?[ \t]*$'''
secretGroup = 1
entropy = 3.0  # hex de 32 tem no máximo 4,0 e às vezes fica abaixo de 3,5: perderia chave real
[[rules.allowlists]]
description = "arquivo de exemplo (.env.example, .env.sample...)"
paths = ['''(?i)\.(?:example|sample|template|dist|defaults?|modelo|exemplo)$''']
[[rules.allowlists]]
description = "variável de frontend (tem regra própria) e valor público ou molde"
regexTarget = "line"
regexes = ['''(?i)^[ \t]*(?:export[ \t]+)?["']?(?:VITE|NEXT_PUBLIC|REACT_APP|EXPO_PUBLIC|PUBLIC)_''', '''(?i)(?:SITE_?KEY|PUBLISHABLE|PUBLIC_KEY|ANON_KEY|_ID|_URL|_URI|_HOST|_NAME)["']?[ \t]*=''']
[[rules.allowlists]]
description = "valor público, URL, referência ou molde"
regexes = [
  '''(?-i)^(?:sb_publishable_|phc_|pk_(?:live|test)_)''',
  '''(?-i)\.ey[A-Za-z0-9_-]*(?:InJvbGUiOiJhbm9uI|Jyb2xlIjoiYW5vbi|icm9sZSI6ImFub24i)''',
  '''(?i)^[a-z][a-z0-9+.-]*://''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo|dummy|fake)''',
]
[[rules.allowlists]]
description = "referência, não o valor: caminho do SSM, variável de ambiente, atributo de config, nome em maiúsculas, texto de exemplo"
regexes = [
  '''(?-i)^/''',
  '''(?-i)^(?:process\.env|import\.meta\.env|os\.environ|os\.getenv|Deno\.env|settings|config|cfg|env|self|this|local|var|_s)\b''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\??\.[A-Za-z_][A-Za-z0-9_]*)+[,;)]?$''',
  '''(?-i)^[a-z_][a-z0-9_]*(?:\[\d+\])?(?:\.[A-Za-z_][A-Za-z0-9_]*(?:\[\d+\])?)+$''',
  '''(?-i)^[A-Z][A-Z0-9_]*=?$''',
  '''(?-i)^[-_]?[a-z]+(?:[-_.][a-z]+)+[.(]?$''',
  '''(?-i)^[a-z]{2,}(?:[A-Z][a-z]{2,})+[0-9]{0,2}[.(]?$''',
  '''(?-i)^!|[(),;]$''',
]
[[rules.allowlists]]
description = "nome que contém key mas não é chave"
regexTarget = "match"
regexes = ['''(?i)valkey''']


[[rules]]
id = "senha-em-tabela"
description = "Senha numa tabela em markdown (| NOME_DA_SENHA | valor |)"
regex = '''(?i)\|[ \t]+\x60?[\w.-]{0,60}?(?:password|passwd|passphrase|senha|pwd)\x60?[ \t]+\|[ \t]+\x60?([^\s|\x60$#{<%][^\s|\x60]{7,127})\x60?[ \t]+\|'''
secretGroup = 1
entropy = 3.0
keywords = ["password", "passwd", "passphrase", "senha", "pwd"]
[[rules.allowlists]]
description = "molde óbvio ou referência"
regexes = [
  '''(?i)^(?:password|senha|passwd|changeme|change_me|secret|segredo|example|exemplo|placeholder|dummy|fake|redacted|null|none|undefined|string|vazio|true|false)\d{0,3}$''',
  '''(?i)(?:x{3,}|\*{3,}|\.{3,}|your[_-]|sua[_-]|seu[_-]|change[_-]?me|replace[_-]?me|insert[_-]|placeholder|example|exemplo)''',
]
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|__fixtures__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']

# ============ ARQUIVOS QUE NUNCA VÃO PRO GIT (pelo nome) ============

[[rules]]
id = "arquivo-claude-settings-local"
description = "Config pessoal do Claude Code (.claude/settings.local.json): é só da sua máquina"
path = '''(?:^|/)\.claude/settings\.local\.json$'''

[[rules]]
id = "arquivo-python-compilado"
description = "Python compilado (.pyc, __pycache__/): o gitleaks não lê binário, e ele pode levar chave junto"
path = '''(?:^|/)__pycache__/|\.py[co]$'''

[[rules]]
id = "arquivo-env-local"
description = ".env.local é só da sua máquina"
path = '''(?:^|/)\.env(?:\.[\w-]+)?\.local$'''

[[rules]]
id = "arquivo-tfstate"
description = "Estado do Terraform guarda senhas em texto puro"
path = '''(?:^|/)[^/]*\.tfstate(?:\.backup)?$'''

[[rules]]
id = "arquivo-kubeconfig"
description = "kubeconfig pelo nome (o do EKS costuma não ter segredo; confira)"
tags = ["suspeita"]
path = '''(?:^|/)(?:\.kube/config|kubeconfig(?:[-_.][\w-]+)?(?:\.ya?ml)?)$'''

[[rules]]
id = "arquivo-chave-ssh"
description = "Chave SSH privada"
path = '''(?:^|/)id_(?:rsa|dsa|ecdsa|ed25519)(?:_sk)?$'''

[[rules]]
id = "arquivo-chave-putty"
description = "Chave privada do PuTTY"
path = '''(?i)\.ppk$'''


# ============ ARQUIVOS QUE NUNCA VÃO PRO GIT (lista ampliada) ============

[[rules]]
id = "arquivo-credencial-de-maquina"
description = "Arquivo de credencial da sua máquina (.netrc, .git-credentials, cofre KeePass, .htpasswd)"
path = '''(?i)(?:^|/)(?:\.netrc|_netrc|\.git-credentials|[^/]+\.kdbx|\.htpasswd)$'''

[[rules]]
id = "arquivo-historico-de-terminal"
description = "Histórico de terminal/banco costuma ter senha digitada"
path = '''(?:^|/)\.(?:bash|zsh|sh|psql|mysql|python|node_repl|sqlite|rediscli)_history$'''

[[rules]]
id = "arquivo-sessao-de-navegador"
description = "Sessão salva do Playwright: tem cookie e token de login"
path = '''(?i)(?:^|/)playwright/\.auth/'''

[[rules]]
id = "arquivo-gravacao-har"
description = "Gravação de navegador (.har): costuma ter cookie e token de login"
path = '''(?i)\.har$'''
tags = ["suspeita"]

[[rules]]
id = "arquivo-dump-de-banco"
description = "Dump de banco de dados (dados de cliente não vão pro git)"
path = '''(?i)\.dump$'''

[[rules]]
id = "arquivo-banco-ou-backup"
description = "Arquivo de banco ou backup (.sqlite, .db, .bak): confira se não tem dado de cliente"
path = '''(?i)\.(?:sqlite3?|db|bak)$'''
tags = ["suspeita"]

[[rules]]
id = "conteudo-dump-postgres"
description = "Dump do Postgres (dados de cliente não vão pro git)"
regex = '''(?m)^(?:-- PostgreSQL database dump|COPY [\w."]+ \([^)]*\) FROM stdin;)'''
keywords = ["postgresql database dump", "from stdin;"]

[[rules]]
id = "k8s-secret-stringdata"
description = "Secret do Kubernetes com valor escrito (use ExternalSecret)"
regex = '''(?i)\bkind:[ \t]*["']?secret["']?(?s:.){0,300}?\bstringData:[ \t]*\n(?:[ \t]+[\w.-]+:[^\n]*\n){0,20}?[ \t]+[\w.-]+:[ \t]*["']?([^\s"'{}$|>][^\s"']{5,})'''
path = '''(?i)\.ya?ml$'''
keywords = ["stringdata"]

[[rules]]
id = "npmrc-pypirc-docker-token"
description = "Token escrito em .npmrc/.pypirc/.docker/config.json (use variável de ambiente)"
path = '''(?i)(?:^|/)(?:\.npmrc|\.pypirc|\.docker/config\.json)$'''
regex = '''(?i)(?:_authToken\s*=\s*|password\s*[=:]\s*|"auth"\s*:\s*")([^\s"$][^\s"]{10,})'''
keywords = ["_authtoken", "password", "auth"]

[[rules]]
id = "kubeconfig-chave-cliente"
description = "Chave de cliente de kubeconfig (dá acesso ao cluster)"
regex = '''\bclient-key-data:[ \t]*([A-Za-z0-9+/=]{100,})'''
keywords = ["client-key-data"]

[[rules]]
id = "variavel-publica-com-segredo"
description = "Variável pública (VITE_/NEXT_PUBLIC_/…) com nome de segredo: o valor vai parar no navegador"
regex = '''\b(?:VITE|NEXT_PUBLIC|REACT_APP|EXPO_PUBLIC)_[A-Z0-9_]*(?:SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|PASSWD)[A-Z0-9_]*["']?\s*[=:]\s*["']?([^\s"'$]{8,})'''
keywords = ["vite_", "next_public_", "react_app_", "expo_public_"]

[[rules]]
id = "variavel-publica-com-chave"
description = "Chave de API em variável de frontend (VITE_/NEXT_PUBLIC_/…): todo visitante do site recebe o valor"
tags = ["suspeita"]
regex = '''\b(?:VITE|NEXT_PUBLIC|REACT_APP|EXPO_PUBLIC)_[A-Z0-9_]*(?:API_KEY|TOKEN|ACCESS_KEY|AUTH_KEY|CLIENT_SECRET)[A-Z0-9_]*["']?\s*[=:]\s*["']?([^\s"'$]{12,})'''
entropy = 3.0
keywords = ["vite_", "next_public_", "react_app_", "expo_public_"]
[[rules.allowlists]]
description = "variáveis públicas por natureza (chave anon, publishable, de site, de mapa, de analytics)"
regexTarget = "line"
regexes = ['''(?i)(?:ANON|PUBLISHABLE|PUBLIC_KEY|SITE_KEY|MAPS|MAPBOX|FIREBASE|POSTHOG|SENTRY|DSN|MEASUREMENT|GA_|GTM|RECAPTCHA|AMPLITUDE|MIXPANEL|SEGMENT|HOTJAR|CLARITY|INTERCOM|CRISP|ONESIGNAL_APP_ID|STRIPE_PK|STRIPE_PUBLISHABLE)''']
[[rules.allowlists]]
description = "valor público pelo formato"
regexes = ['''^(?:pk_(?:live|test)_|phc_|sb_publishable_)''']
[[rules.allowlists]]
description = "dentro de pasta/arquivo de teste"
paths = ['''(?i)(?:^|/)(?:tests?|__tests__|__fixtures__|spec|specs|fixtures?|mocks?|e2e|cypress|playwright)/|\.(?:test|spec)\.[cm]?[jt]sx?$|(?:^|/)test_[^/]*\.py$|_test\.(?:py|go)$|(?:^|/)conftest\.py$''']
[[rules.allowlists]]
description = "arquivo de exemplo (.env.example, .env.dist...) ou nome que só descreve"
paths = ['''(?i)\.(?:example|sample|template|dist|defaults?|modelo|exemplo)$''']
[[rules.allowlists]]
description = "nome que só descreve (TTL, URL...) ou valor que é referência"
regexTarget = "line"
regexes = ['''(?i)_(?:TTL|EXPIRES?|EXPIRATION|URL|URI|NAME|ID|HEADER|TYPE|ENABLED)["']?\s*[=:]''', '''(?i)(?:import\.meta\.env|process\.env)\.''']

# ============ CORREÇÃO DO FIM DA CHAVE (gerado) ============
# Nas regras padrão, a chave só casava se viesse seguida de aspas, espaço, ; ou fim de linha.
# Aqui aceitamos também ) , } ] & < > | # * . ! ? \ / @ : depois da chave, e | ou ] antes do sinal. Gerado de gitleaks 8.30.1.
[[rules]]
id = "adafruit-api-key"
regex = '''(?i)[\w.-]{0,50}?(?:adafruit)(?:[ \t\w.-]{0,20})[\s'"\]]{0,4}(?:=|>|:{1,3}=|\|\|?|:|=>|\?=|,)[\x60'"\s=]{0,5}([a-z0-9_-]{32})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
[[rules]]
id = "adobe-client-id"
regex = '''(?i)[\w.-]{0,50}?(?:adobe)(?:[ \t\w.-]{0,20})[\s'"\]]{0,4}(?:=|>|:{1,3}=|\|\|?|:|=>|\?=|,)[\x60'"\s=]{0,5}([a-f0-9]{32})(?:[\x60'"\s;,)}\]&<>|#*.!?\\/@:]|$)'''
[[rules]]
id = "adobe-client-secret"
